<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register Nexapro</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="register-box">
    <h1 class="logo">NEXAPRO</h1>
    <p class="tagline">Buat Akun Baru</p>

    <form>
      <!-- Nama Lengkap
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-user"></i></span>
        <input type="text" class="form-control" placeholder="Nama Lengkap" required>
      </div> -->

      <!-- Username -->
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-user-circle"></i></span>
        <input type="text" class="form-control" placeholder="Username" required>
      </div>
      
      <!-- Email -->
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
        <input type="email" class="form-control" placeholder="Email" required>
      </div>


      <!-- Password -->
      <div class="mb-3 input-group password-group">
        <span class="input-group-text"><i class="fas fa-lock"></i></span>
        <input type="password" class="form-control" id="password" placeholder="Password" required>
        <i class="fas fa-eye-slash toggle-password" data-target="password"></i>
      </div>

      <!-- Konfirmasi Password
      <div class="mb-3 input-group password-group">
        <span class="input-group-text"><i class="fas fa-lock"></i></span>
        <input type="password" class="form-control" id="confirm-password" placeholder="Konfirmasi Password" required>
        <i class="fas fa-eye-slash toggle-password" data-target="confirm-password"></i>
      </div> -->

      <!-- Tombol Register -->
      <button type="submit" class="btn-register">REGISTER</button>
    </form>

    <!-- Link ke Login -->
    <p class="register-text">
      Sudah punya akun?
      <a href="./login.html" class="register-link">Login di sini</a>
    </p>

    <!-- Social Login -->
    <div class="social-login">
      <p>Atau daftar dengan</p>
      <div class="social-buttons">
        <a href="#"><i class="fab fa-google"></i></a>
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-github"></i></a>
      </div>
    </div>
  </div>

  <script>
    // Toggle show/hide password
    const toggles = document.querySelectorAll(".toggle-password");
    toggles.forEach(toggle => {
      const targetId = toggle.dataset.target;
      const input = document.getElementById(targetId);

      function updateIcon() {
        if (input.type === "password") {
          toggle.classList.remove("fa-eye");
          toggle.classList.add("fa-eye-slash");
        } else {
          toggle.classList.remove("fa-eye-slash");
          toggle.classList.add("fa-eye");
        }
      }

      toggle.addEventListener("click", () => {
        input.type = (input.type === "password") ? "text" : "password";
        updateIcon();
      });

      // set ikon awal
      updateIcon();
    });
  </script>
</body>
</html>
